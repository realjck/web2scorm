name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # ou master si c’est ta branche par défaut

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the build to the gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
